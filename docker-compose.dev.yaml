services:

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    depends_on:
      - db
    ports:
      - "9000:8080"
    volumes:
      - .:/app
      - gradle-cache:/root/.gradle
    working_dir: /app
    command: ./gradlew run
    environment:
      DB_URL: jdbc:postgresql://db:5432/app_db
      DB_USER: app_user
      DB_PASSWORD: app_password

volumes:
  gradle-cache: